name: Ingest

on:
  schedule:
    - cron: "23 * * * *"   # hourly, off the top of the hour when GitHub is busiest
  workflow_dispatch:

# One run at a time; a slow run is not cancelled, the next one waits.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write   # only to commit status/alive.txt

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
  ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
  CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
  # Flight boards stay off until this secret exists. The two variables are only needed if
  # AeroDataBox's direct subscription uses a different base URL or key header than API.market.
  AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
  AERODATABOX_BASE_URL: ${{ vars.AERODATABOX_BASE_URL }}
  AERODATABOX_KEY_HEADER: ${{ vars.AERODATABOX_KEY_HEADER }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Names and lengths only, never values. Stops early with a clear
      # message if a secret is missing or R2 rejects the keys.
      - run: python scripts/preflight.py

      # Each source runs even if an earlier one failed. A failed source
      # uploads nothing, so R2 keeps its last good file.
      - run: python scripts/publish_static.py

      - id: firms
        continue-on-error: true
        run: python scripts/ingest_firms.py

      - id: met
        continue-on-error: true
        run: python scripts/ingest_met.py

      - id: cams
        continue-on-error: true
        run: python scripts/ingest_cams.py

      - id: flights
        continue-on-error: true
        run: python scripts/ingest_flights.py

      # GitHub disables scheduled workflows after 60 days without repo
      # activity. One commit per day keeps the schedule alive.
      - name: Keep schedule alive
        run: |
          today=$(date -u +%F)
          if [ "$(cat status/alive.txt 2>/dev/null)" != "$today" ]; then
            echo "$today" > status/alive.txt
            git config user.name "borneosky-bot"
            git config user.email "borneosky-bot@users.noreply.github.com"
            git add status/alive.txt
            git commit -m "Ingest still running: $today"
            git push
          fi

      - name: Fail the run if any source failed
        if: steps.firms.outcome == 'failure' || steps.met.outcome == 'failure' || steps.cams.outcome == 'failure' || steps.flights.outcome == 'failure'
        run: |
          echo "firms=${{ steps.firms.outcome }} met=${{ steps.met.outcome }} cams=${{ steps.cams.outcome }} flights=${{ steps.flights.outcome }}"
          exit 1
